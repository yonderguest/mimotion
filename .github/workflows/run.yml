name: MiMotion

on:
  schedule:
    - cron: '25 1,7,10,12,14,23 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only login and calculate steps, do not submit steps'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout codes
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.PAT }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Run MiMotion
        env:
          CONFIG: ${{ secrets.CONFIG }}
          AES_KEY: ${{ secrets.AES_KEY }}
          FORCE_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          pip3 install -r requirements.txt
          python3 main.py

      - name: Persist encrypted tokens
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add encrypted_tokens.data
          if git diff --cached --quiet; then
            echo "No token changes to persist."
          else
            git commit -m "persist tokens trigger by ${{ github.event_name }}"
            git push origin master
          fi
