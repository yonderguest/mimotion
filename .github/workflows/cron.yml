name: Random Cron

on:
  workflow_run:
    workflows: ["MiMotion"]
    types:
      - completed
  workflow_dispatch:

jobs:
  repo-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.PAT }}

      - name: Randomize cron
        run: |
          source cron_convert.sh
          echo "configed CRON_HOURS ${{ vars.CRON_HOURS }}"
          persist_execute_log ${{ github.event_name }} ${{ vars.CRON_HOURS }}
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add .github/workflows/run.yml cron_change_time
          current=`TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S'`
          if git diff --cached --quiet; then
            echo "No cron changes to persist."
          else
            git commit -m "[${current}] random cron trigger by ${{ github.event_name }}"
            git push origin master
          fi
